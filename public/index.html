<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NX8020™ Process Optimizer</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link href="https://unpkg.com/vis-network/styles/vis-network.min.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 200px;
            background-color: #2563EB;
            padding: 20px;
        }
        .sidebar-title {
            color: #FFFFFF;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .sidebar-menu {
            list-style-type: none;
            padding: 0;
        }
        .sidebar-menu li {
            margin-bottom: 10px;
        }
        .sidebar-menu a {
            color: #FFFFFF;
            text-decoration: none;
            font-size: 16px;
            display: block;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: #1E40AF;
        }
        .main-content {
            flex-grow: 1;
            padding: 40px;
            background: linear-gradient(to bottom, #EBF4FF, #FFFFFF);
        }
        h1 {
            color: #1E3A8A;
            font-size: 28px;
            margin-bottom: 20px;
        }
        .card {
            background-color: #FFFFFF;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .card-header {
            background-color: #F3F4F6;
            padding: 15px 20px;
            border-bottom: 1px solid #E5E7EB;
        }
        .card-title {
            margin: 0;
            color: #111827;
            font-size: 18px;
        }
        .card-content {
            padding: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #374151;
        }
        input[type="text"],
        input[type="password"],
        input[type="file"],
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #D1D5DB;
            border-radius: 4px;
            font-size: 14px;
        }
        .button {
            background-color: #3B82F6;
            color: #FFFFFF;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #2563EB;
        }
        .file-upload, .real-time-data {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .file-upload input[type="file"], .real-time-data select {
            flex-grow: 1;
            margin-right: 10px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        #visualization-container {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 class="sidebar-title">Process Mining</h2>
        <ul class="sidebar-menu">
            <li><a href="#data" class="active" onclick="showTab('data')">Data</a></li>
            <li><a href="#visualization" onclick="showTab('visualization')">Visualization</a></li>
            <li><a href="#analysis" onclick="showTab('analysis')">Analysis</a></li>
            <li><a href="#simulation" onclick="showTab('simulation')">Simulation</a></li>
        </ul>
    </div>
    <div class="main-content">
        <div id="data" class="tab-content active">
            <h1>Data Input</h1>
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">File Upload</h2>
                </div>
                <div class="card-content">
                    <div class="file-upload">
                        <input type="file" id="file-upload" name="file-upload">
                        <button class="button" onclick="uploadFile()">Upload File</button>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Real Time Data</h2>
                </div>
                <div class="card-content">
                    <div class="real-time-data">
                        <select id="crm-erp-system">
                            <option value="salesforce">Salesforce</option>
                            <option value="sap">SAP</option>
                            <option value="oracle">Oracle</option>
                            <option value="netsuite">NetSuite</option>
                            <option value="dynamics">Dynamics</option>
                        </select>
                        <button class="button" onclick="connectCRM()">Connect</button>
                    </div>
                    <div class="input-group">
                        <label for="api-key">API Key</label>
                        <input type="password" id="api-key" name="api-key" placeholder="Enter API Key">
                    </div>
                </div>
            </div>
        </div>
        <div id="visualization" class="tab-content">
            <h1>Visualization</h1>
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Process Flow</h2>
                </div>
                <div class="card-content">
                    <div id="visualization-container"></div>
                </div>
            </div>
        </div>
        <div id="analysis" class="tab-content">
            <h1>Analysis</h1>
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Process Analysis</h2>
                </div>
                <div class="card-content">
                    <div id="analysis-content"></div>
                </div>
            </div>
        </div>
        <div id="simulation" class="tab-content">
            <h1>Simulation</h1>
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Process Simulation</h2>
                </div>
                <div class="card-content">
                    <p>Simulation features coming soon.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/visualization.js') }}"></script>
    <script>
        function uploadFile() {
            const fileInput = document.getElementById('file-upload');
            const file = fileInput.files[0];
            if (file) {
                const formData = new FormData();
                formData.append('file', file);

                fetch('/generate', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Success:', data);
                    showTab('visualization');
                    if (window.visualizer) {
                        window.visualizer.createVisualization(data);
                    }
                    document.getElementById('analysis-content').innerHTML = `
                        <h3>Bottlenecks:</h3>
                        <ul>
                            ${data.bottlenecks.map(b => `<li>${b}</li>`).join('')}
                        </ul>
                        <h3>Optimization Suggestions:</h3>
                        <p>${data.optimization}</p>
                    `;
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error uploading file');
                });
            } else {
                alert('Please select a file to upload');
            }
        }

        function connectCRM() {
            const crmSystem = document.getElementById('crm-erp-system').value;
            const apiKey = document.getElementById('api-key').value;
            if (crmSystem && apiKey) {
                console.log('Connecting to:', crmSystem);
            } else {
                alert('Please select a system and enter the API Key');
            }
        }

        function showTab(tabId) {
            console.log('Switching to', tabId, 'tab');
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
            document.querySelectorAll('.sidebar-menu a').forEach(link => {
                link.classList.remove('active');
            });
            document.querySelector(`.sidebar-menu a[href="#${tabId}"]`).classList.add('active');
        }
    </script>
</body>
</html>
